<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#353b47">
<title>GameBuddy</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#262a33;color:#f2f2f5;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif;-webkit-tap-highlight-color:transparent}
#app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:84px;background:#2f3440}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:12px 14px;background:#353b47;border-bottom:1px solid #434a58}
.top h1{flex:1;margin:0;font-size:18px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .right{display:flex;gap:8px;min-width:38px;justify-content:flex-end}
.icon{width:38px;height:38px;border-radius:50%;border:0;background:#4a5160;cursor:pointer;font-size:16px;display:inline-grid;place-items:center;flex-shrink:0}
.icon.ghost-space{visibility:hidden}
main{padding:14px}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;display:flex;background:#353b47;border-top:1px solid #434a58;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
.bottom a{flex:1;text-align:center;padding:8px 0 10px;font-size:11px;color:#9aa1b1;position:relative}
.bottom .adm{display:none}
.bottom a.on{color:#f28bb4}
.ni{display:block;font-size:20px;line-height:1.3}
.nbadge,.ndot{position:absolute;top:4px;left:calc(50% + 6px);background:#ef5350;color:#fff;border-radius:10px;font-size:10px;padding:1px 5px;min-width:16px}
.ndot{width:9px;height:9px;min-width:0;padding:0;top:6px;left:calc(50% + 14px)}
.card{background:#3a3f4b;border-radius:16px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:16px}
.row{display:flex;align-items:center;gap:12px}
.row.gap{justify-content:center;gap:10px}
.grow{flex:1;min-width:0}
.link{display:flex;align-items:center;gap:12px;cursor:pointer;width:100%;border:0;text-align:left;font-size:15px;color:inherit}
.ic{width:44px;height:44px;border-radius:50%;background:#4b5263;display:grid;place-items:center;font-size:20px;flex-shrink:0}
.av{width:52px;height:52px;border-radius:50%;background:#4b5263;display:grid;place-items:center;font-size:28px;flex-shrink:0;border:2px solid #5a6172;background-size:cover;background-repeat:no-repeat}
.av.sm{width:30px;height:30px;font-size:16px;border-width:1px}
.av.lg{width:96px;height:96px;font-size:56px;margin:12px auto}
.av.pick{width:48px;height:48px;cursor:pointer;border:2px solid transparent}
.av.pick.on{border-color:#f28bb4}
.avpick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.avrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.name{font-weight:600}
.muted{color:#9aa1b1}
.small{font-size:12px}
.center{text-align:center}
.sec{font-size:14px;color:#9aa1b1;margin:16px 4px 8px;font-weight:600;display:flex;align-items:center;gap:8px}
.empty{text-align:center;color:#9aa1b1;padding:30px 10px;line-height:1.7}
.list{display:flex;flex-direction:column}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-block;background:#4b5263;border-radius:12px;padding:2px 9px;font-size:12px;margin:2px 4px 2px 0}
.chips{margin:4px 0}
.tag{background:#4b5263;border-radius:8px;padding:3px 8px;font-size:12px;color:#c9ced9;white-space:nowrap}
.badge{background:#ef5350;color:#fff;border-radius:10px;padding:1px 7px;font-size:12px;min-width:20px;text-align:center}
.btn{border:0;border-radius:22px;padding:10px 16px;cursor:pointer;background:#4b5263;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn.primary,.btn.pink{background:#f28bb4;color:#2b1a24}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.block{width:100%;margin-top:12px}
.danger{color:#ef7a7a}
.seg{display:flex;background:#434a58;border-radius:22px;padding:4px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:18px;cursor:pointer;color:#c9ced9;font-weight:600}
.seg button.on{background:#f28bb4;color:#2b1a24}
.filters{display:flex;gap:8px;margin-bottom:8px}
.search,.form input,.form select,.form textarea,.composer input,.notice input,#rc{width:100%;background:#434a58;border:1px solid #515a6b;border-radius:12px;padding:10px 12px;outline:none}
.filters .search{flex:1;width:auto}
.filters select{background:#434a58;border:1px solid #515a6b;border-radius:12px;padding:10px}
.form label{display:block;margin:12px 0 6px;font-size:13px;color:#c9ced9}
.form textarea{min-height:70px;resize:vertical}
.form .btn{margin-top:16px;width:100%}
.hero{display:flex;align-items:center;justify-content:space-between;gap:10px;background:linear-gradient(120deg,#4f7fd0,#8b5cd6)}
.hero .muted{color:#e4e8f5}
.hero .btn{background:#fff;color:#333}
.games{display:flex;flex-wrap:wrap;gap:8px}
.game-btn{background:#434a58;border:1px solid #515a6b;border-radius:16px;padding:7px 12px;cursor:pointer;font-size:13px}
.game-btn.on{background:#f28bb4;color:#2b1a24;border-color:#f28bb4}
.notice{background:#434a58;border-radius:14px;padding:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px;color:#c9ced9;font-size:14px}
.msgs{height:calc(100vh - 250px);min-height:280px;overflow-y:auto;padding:4px 2px 12px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:78%;align-self:flex-start}
.msg.mine{align-self:flex-end;text-align:right}
.sender{font-size:11px;color:#9aa1b1;margin:0 4px 2px}
.bubble{background:#4b5263;padding:9px 13px;border-radius:16px;border-top-left-radius:4px;white-space:pre-wrap;word-break:break-word;display:inline-block;text-align:left}
.msg.mine .bubble{background:#f28bb4;color:#2b1a24;border-top-left-radius:16px;border-top-right-radius:4px}
.t{font-size:10px;color:#9aa1b1;margin-top:2px}
.composer{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);width:calc(100% - 28px);max-width:492px;display:flex;gap:8px;background:#2f3440;padding:6px 0}
.composer input{flex:1;width:auto}
.profile{background:#3a3f4b;border-radius:18px;overflow:hidden;margin-bottom:12px}
.cover{height:110px;background:linear-gradient(120deg,#5aa7e6,#7fc6f0);background-repeat:no-repeat}
.pcard{padding:0 16px 16px;margin-top:-45px;text-align:center}
.pav{width:88px;height:88px;border-radius:50%;margin:0 auto;background:#4b5263;border:4px solid #3a3f4b;display:grid;place-items:center;font-size:48px;background-repeat:no-repeat}
.pname h2{margin:8px 0 0;font-size:20px}
.stars{color:#ffb74d;letter-spacing:2px;font-size:16px;margin:6px 0}
.stars.sm{font-size:12px;letter-spacing:1px;margin:0}
.info{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;font-size:13px;color:#c9ced9;margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.stat{background:#3a3f4b;border-radius:14px;padding:12px 6px;text-align:center;cursor:pointer;border:0;color:inherit}
.stat b{display:block;font-size:20px;color:#8ec5f0}
.stat span{font-size:12px;color:#9aa1b1}
.actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.rev{border-top:1px solid #464d5c;padding:10px 0}
.rev-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.starpick{display:flex;gap:6px;margin:8px 0}
.starpick button{background:none;border:0;font-size:30px;color:#5c6375;cursor:pointer;padding:0}
.starpick button.on{color:#ffb74d}
.link-name{cursor:pointer}
.match-box{text-align:center;padding:24px 16px}
.big{font-size:56px}
.radar{font-size:56px;animation:pulse 1.4s infinite}
@keyframes pulse{50%{transform:scale(1.15)}}
.notif.unread{border-left:3px solid #f28bb4}
.auth{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px;max-width:420px;margin:0 auto}
.logo{font-size:56px;text-align:center}
.brand{text-align:center;margin:4px 0 0}
.big-num{font-size:36px;font-weight:700;color:#8ec5f0;margin:4px 0}
.ad{display:none}
.attach{cursor:pointer;width:38px;height:38px;flex-shrink:0;background:#4a5160;border-radius:50%;display:grid;place-items:center;font-size:18px}
.bubble img{max-width:220px;border-radius:12px;display:block}
.msg.mine .bubble img{margin-left:auto}
.stats.six{grid-template-columns:repeat(3,1fr)}
.preview-box{width:100%;height:100px;background:#20232a;border-radius:10px;overflow:hidden;position:relative;border:1px solid #515a6b;margin-bottom:8px}
.preview-cover{width:100%;height:100%;background-size:cover;background-repeat:no-repeat}
.preview-av{width:60px;height:60px;border-radius:50%;position:absolute;bottom:10px;left:14px;border:2px solid #fff;background-size:cover;background-repeat:no-repeat;background-color:#4b5263;display:grid;place-items:center;font-size:24px}

@media (min-width: 900px) {
  #app{max-width:none;padding-left:220px;padding-bottom:0}
  main{max-width:980px;margin:0 auto}
  .top{padding-left:24px;padding-right:24px}
  .bottom{position:fixed;top:0;bottom:0;left:0;transform:none;width:220px;max-width:none;flex-direction:column;border-top:0;border-right:1px solid #434a58;padding:16px 10px;background:#303643}
  .bottom a{flex:none;display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;font-size:15px;border-radius:12px;margin-bottom:4px;position:relative}
  .bottom a.on{background:#4b5263}
  .ni{display:inline-block;font-size:20px;width:26px;text-align:center}
  .nbadge{position:static;margin-left:auto}
  .ndot{position:static;margin-left:auto;width:9px;height:9px;padding:0;min-width:0}
  .composer{left:calc(50% + 110px);bottom:16px;width:calc(100% - 300px);max-width:900px}
  #list.list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  #list.list > .empty{grid-column:1/-1}
  .stats.six{grid-template-columns:repeat(6,1fr)}
  .msgs{height:calc(100vh - 240px)}
  .auth{max-width:460px}
  .toast{left:calc(50% + 110px)}
  .bottom .adm{display:flex}
}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:#f2f2f5;color:#222;padding:10px 16px;border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.35);z-index:50;max-width:90%;font-size:14px;animation:up .25s}
@keyframes up{from{opacity:0;transform:translate(-50%,10px)}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const state = {
  me: null, meta: null,
  token: localStorage.getItem('gb_token'),
  match: { searching: false },
  matchFound: null,
  notifUnread: 0,
  wallet: null,
};
let gTimer = null, vTimer = null, lastMatchKey = '';
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ICON = { friend_request: '👋', friend: '🤝', match: '🎮', rating: '⭐', room: '🧩' };
const NOTIF_LINK = { friend_request: '#/friends', friend: '#/chat/dm', match: '#/match', rating: '#/me', room: '#/home' };
const go = (h) => { location.hash = h; };
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const fmtTime = (ts) => new Date(ts).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
const stars = (n) => { const r = Math.round(n || 0); return '★'.repeat(r) + '☆'.repeat(5 - r); };
function timeAgo(ts) {
  const s = (Date.now() - ts) / 1000;
  if (s < 60) return 'เมื่อสักครู่';
  if (s < 3600) return Math.floor(s / 60) + ' นาทีที่แล้ว';
  if (s < 86400) return Math.floor(s / 3600) + ' ชม.ที่แล้ว';
  return new Date(ts).toLocaleDateString('th-TH');
}

const avatarHtml = (u, cls = '') => {
  const av = u?.avatar || '🙂';
  const zoom = u?.avatarZoom || 100;
  const pos = u?.avatarPos || { x: 50, y: 50 };
  if (av.startsWith('/api/images/') || av.startsWith('data:')) {
    return `<div class="av ${cls}" style="background-image:url('${esc(av)}');background-size:${zoom}%;background-position:${pos.x}% ${pos.y}%"></div>`;
  }
  return `<div class="av ${cls}">${esc(av)}</div>`;
};

function toast(html) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = html;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3200);
}

async function api(method, url, body) {
  const opt = { method, headers: {} };
  if (state.token) opt.headers.Authorization = 'Bearer ' + state.token;
  if (body !== undefined) { opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
  let res;
  try { res = await fetch(url, opt); } catch { throw new Error('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้'); }
  const data = await res.json().catch(() => ({}));
  if (res.status === 401 && !url.startsWith('/api/auth')) { forceLogout(); throw new Error('กรุณาเข้าสู่ระบบใหม่'); }
  if (!res.ok) throw new Error(data.error || 'เกิดข้อผิดพลาด');
  return data;
}
async function act(fn) {
  try { await fn(); render(); } catch (e) { toast(esc(e.message)); }
}
const acceptReq = (id) => act(() => api('POST', `/api/friends/${id}/accept`));
const dropReq = (id, msg = 'ยืนยัน?') => { if (confirm(msg)) act(() => api('DELETE', `/api/friends/${id}`)); };
const addFriend = (uid) => act(async () => {
  const r = await api('POST', '/api/friends/request', { userId: uid });
  toast(r.status === 'friends' ? 'เป็นเพื่อนกันแล้ว 🎉' : 'ส่งคำขอเป็นเพื่อนแล้ว');
});
async function logout() {
  try { await api('POST', '/api/auth/logout'); } catch {}
  forceLogout();
  go('#/home');
}
function forceLogout() {
  state.token = null; state.me = null;
  localStorage.removeItem('gb_token');
  stopTimers();
  renderAuth('login');
}
function stopTimers() { clearInterval(gTimer); clearInterval(vTimer); gTimer = vTimer = null; }
function stopViewTimer() { clearInterval(vTimer); vTimer = null; }

function startPolling() { stopTimers(); gTimer = setInterval(globalTick, 3000); globalTick(); }
async function globalTick() {
  if (!state.token || !state.me) return;
  try {
    const m = await api('GET', '/api/match');
    if (m.result) {
      state.matchFound = m.result;
      toast(`🎉 พบคู่เล่น ${esc(m.result.match.game)} กับ ${esc(m.result.partner.displayName)}`);
    }
    state.match = m;
    const c = await api('GET', '/api/notifications/count');
    state.notifUnread = c.unread;
    state.wallet = await api('GET', '/api/wallet');
    updateNav();
    const key = JSON.stringify([m.searching, m.game, !!state.matchFound]);
    if (location.hash.startsWith('#/match') && key !== lastMatchKey) drawMatch();
    lastMatchKey = key;
  } catch {}
}
function updateNav() {
  const b = $('#notifBadge');
  if (b) { b.textContent = state.notifUnread; b.hidden = !state.notifUnread; }
  const d = $('#matchDot');
  if (d) d.hidden = !state.match?.searching;
}

function renderAuth(mode = 'login') {
  stopViewTimer();
  $('#app').innerHTML = `<div class="auth">
    <div class="logo">🎮</div>
    <h1 class="brand">GameBuddy</h1>
    <p class="muted center">หาเพื่อนร่วมเล่นเกม (ฟรี 100%)</p>
    <div class="card">
      <div class="seg">
        <button id="tLogin" class="${mode === 'login' ? 'on' : ''}">เข้าสู่ระบบ</button>
        <button id="tReg" class="${mode === 'reg' ? 'on' : ''}">สมัครสมาชิก</button>
      </div>
      <form id="authForm" class="form">
        ${mode === 'reg' ? `<label>ชื่อที่แสดง<input name="displayName" maxlength="24" placeholder="เช่น ฟ้า"></label>` : ''}
        <label>ชื่อผู้ใช้<input name="username" autocomplete="username" placeholder="a-z, 0-9, _ (3-16 ตัว)"></label>
        <label>รหัสผ่าน<input name="password" type="password" autocomplete="${mode === 'reg' ? 'new-password' : 'current-password'}"></label>
        <button class="btn primary">${mode === 'reg' ? 'สมัครและเข้าใช้งาน' : 'เข้าสู่ระบบ'}</button>
      </form>
      ${mode === 'login' && state.meta?.demo ? '<p class="muted small center">บัญชีทดลอง: demo1 ถึง demo5 รหัสผ่าน demo1234</p>' : ''}
    </div>
  </div>`;
  $('#tLogin').onclick = () => renderAuth('login');
  $('#tReg').onclick = () => renderAuth('reg');
  $('#authForm').onsubmit = async (e) => {
    e.preventDefault();
    try {
      const r = await api('POST', mode === 'reg' ? '/api/auth/register' : '/api/auth/login', Object.fromEntries(new FormData(e.target)));
      state.token = r.token;
      localStorage.setItem('gb_token', r.token);
      state.me = r.user;
      startPolling();
      go('#/home');
      render();
    } catch (err) { toast(esc(err.message)); }
  };
}

function navItem(key, icon, label, active) {
  const badge = key === 'notif'
    ? `<span class="nbadge" id="notifBadge" ${state.notifUnread ? '' : 'hidden'}>${state.notifUnread}</span>` : '';
  const dot = key === 'match'
    ? `<span class="ndot" id="matchDot" ${state.match?.searching ? '' : 'hidden'}></span>` : '';
  return `<a href="#/${key}" class="${active === key ? 'on' : ''}"><span class="ni">${icon}</span>${badge}${dot}<span>${label}</span></a>`;
}

function layout({ title, back, right = '', tab, body }) {
  $('#app').innerHTML = `
    <header class="top">
      ${back ? `<button class="icon" onclick="history.length>1?history.back():go('#/home')">‹</button>` : '<span class="icon ghost-space"></span>'}
      <h1>${esc(title)}</h1>
      <div class="right">${right}</div>
    </header>
    <main>${body}</main>
    <nav class="bottom">
      ${navItem('home', '🏠', 'หน้าแรก', tab)}
      ${navItem('chat', '💬', 'แชท', tab)}
      ${navItem('match', '🎮', 'Auto match', tab)}
      ${navItem('notif', '🔔', 'แจ้งเตือน', tab)}
      ${navItem('me', '👤', 'My Page', tab)}
      ${state.me?.isAdmin ? `<a href="#/admin" class="adm ${location.hash.startsWith('#/admin') ? 'on' : ''}"><span class="ni">🛠️</span><span>ผู้ดูแลระบบ</span></a>` : ''}
    </nav>`;
  window.scrollTo(0, 0);
}

window.addEventListener('hashchange', render);
async function render() {
  if (!state.me) return renderAuth('login');
  stopViewTimer();
  const [view = 'home', arg] = (location.hash || '#/home').replace(/^#\/?/, '').split('/');
  try {
    switch (view) {
      case 'home': return await vHome();
      case 'find': return await vFind();
      case 'chat': return await vChat(arg || 'dm');
      case 'dm': return await vDM(arg);
      case 'group': return await vGroup(arg);
      case 'groups-new': return vGroupNew();
      case 'match': return vMatch();
      case 'notif': return await vNotif();
      case 'me': return await vMe();
      case 'me-edit': return await vEdit();
      case 'wallet': return await vWallet();
      case 'admin': return await vAdmin(arg || 'stats');
      case 'user': return await vUser(arg);
      case 'friends': return await vFriends();
      case 'visitors': return await vVisitors();
      case 'matches': return await vMatches();
      case 'room-new': return vRoomNew();
      case 'room': return await vRoom(arg);
      default: go('#/home');
    }
  } catch (e) { toast(esc(e.message)); }
}

function userCard(u) {
  return `<div class="card row link" onclick="go('#/user/${u.id}')">
    ${avatarHtml(u)}
    <div class="grow">
      <div class="name">${esc(u.displayName)} <span class="muted small">@${esc(u.username)}</span></div>
      <div class="chips">${u.games.slice(0, 3).map((g) => `<span class="chip">${esc(g)}</span>`).join('')}</div>
      <div class="muted small">${esc(u.platform)} · ${esc(u.level)} · ⭐ ${u.rating.avg || '-'} (${u.rating.count})</div>
    </div>
    ${relBtn(u)}
  </div>`;
}
function relBtn(u) {
  switch (u.rel) {
    case 'friends': return `<button class="btn sm" onclick="event.stopPropagation();go('#/dm/${u.id}')">💬</button>`;
    case 'none': return `<button class="btn sm pink" onclick="event.stopPropagation();addFriend('${u.id}')">+ เพิ่ม</button>`;
    case 'outgoing': return `<span class="tag">ส่งคำขอแล้ว</span>`;
    case 'incoming': return `<span class="tag">รอตอบรับ</span>`;
    default: return '';
  }
}

function profileHeader(u) {
  const coverZoom = u?.coverZoom || 100;
  const coverPos = u?.coverPos || { x: 50, y: 50 };
  const coverStyle = u?.cover ? `style="background-image:url('${esc(u.cover)}');background-size:${coverZoom}%;background-position:${coverPos.x}% ${coverPos.y}%"` : '';
  
  const avZoom = u?.avatarZoom || 100;
  const avPos = u?.avatarPos || { x: 50, y: 50 };
  const hasAvImg = u?.avatar && (u.avatar.startsWith('/api/images/') || u.avatar.startsWith('data:'));
  const avStyle = hasAvImg ? `style="background-image:url('${esc(u.avatar)}');background-size:${avZoom}%;background-position:${avPos.x}% ${avPos.y}%;font-size:0"` : '';
  const avText = hasAvImg ? '' : esc(u.avatar || '🙂');

  return `<div class="profile">
    <div class="cover" ${coverStyle}></div>
    <div class="pcard">
      <div class="pav" ${avStyle}>${avText}</div>
      <div class="pname"><h2>${esc(u.displayName)}</h2><span class="muted small">@${esc(u.username)}</span></div>
      <div class="stars">${stars(u.rating.avg)}</div>
      <div class="muted small">${u.rating.avg || '-'} (${u.rating.count} รีวิว)</div>
      <p>${esc(u.bio || 'ยังไม่มีคำแนะนำตัว')}</p>
      <div class="chips">${u.games.map((g) => `<span class="chip">${esc(g)}</span>`).join('') || '<span class="muted small">ยังไม่ได้เลือกเกม</span>'}</div>
      <div class="info"><span>🖥️ ${esc(u.platform)}</span><span>🏅 ${esc(u.level)}</span>${u.schedule ? `<span>🕒 ${esc(u.schedule)}</span>` : ''}</div>
    </div>
  </div>`;
}

function ratingsHtml(u) {
  if (!u.ratings?.length) return '<div class="muted small">ยังไม่มีรีวิว</div>';
  return u.ratings.map((r) => `<div class="rev">
    <div class="rev-h"><b>${esc(r.from?.displayName || 'ผู้ใช้')}</b><span class="stars sm">${stars(r.score)}</span></div>
    ${r.comment ? `<div>${esc(r.comment)}</div>` : ''}
    <div class="muted small">${timeAgo(r.at)}</div>
  </div>`).join('');
}
function bubbles(msgs, withName) {
  if (!msgs.length) return '<div class="empty">เริ่มทักทายกันได้เลย 👋</div>';
  return msgs.map((m) => `<div class="msg ${m.mine ? 'mine' : ''}">
    ${withName && !m.mine && m.from ? `<div class="sender">${esc(m.from.displayName)}</div>` : ''}
    ${m.image ? `<img src="${m.image}" alt="รูปที่ส่ง">` : ''}
    ${m.text ? `<div class="bubble">${esc(m.text)}</div>` : ''}
    <div class="t">${fmtTime(m.at)}</div>
  </div>`).join('');
}
function paintMsgs(el, html, force) {
  const near = el.scrollHeight - el.scrollTop - el.clientHeight < 80;
  el.innerHTML = html;
  if (force || near) el.scrollTop = el.scrollHeight;
}
const composerHtml = `<form class="composer" id="composer"><label class="attach" title="ส่งรูป">🖼️<input id="imgIn" type="file" accept="image/png,image/jpeg,image/gif,image/webp" hidden></label><input id="msgIn" maxlength="500" placeholder="พิมพ์ข้อความ..." autocomplete="off"><button class="btn primary">ส่ง</button></form>`;
async function refreshWallet() { try { state.wallet = await api('GET', '/api/wallet'); } catch {} }
function bindComposer(fn) {
  const f = $('#composer');
  if (!f) return;
  let image = null;
  const pick = $('#imgIn');
  pick.onchange = () => {
    const file = pick.files[0];
    if (!file) return;
    if (file.size > 2 * 1024 * 1024) { toast('รูปใหญ่เกิน 2 MB'); pick.value = ''; return; }
    const r = new FileReader();
    r.onload = () => { image = r.result; toast('แนบรูปภาพแล้ว (ส่งฟรี)'); };
    r.readAsDataURL(file);
  };
  f.onsubmit = async (e) => {
    e.preventDefault();
    const i = $('#msgIn');
    const t = i.value.trim();
    if (!t && !image) return;
    const sendImg = image;
    image = null;
    pick.value = '';
    i.value = '';
    try { await fn(t, sendImg); await refreshWallet(); }
    catch (err) { toast(esc(err.message)); i.value = t; image = sendImg; }
  };
}

async function loadRooms() {
  const el = $('#rooms');
  if (!el) return;
  const rooms = await api('GET', `/api/rooms?game=${encodeURIComponent($('#rgame').value)}`);
  el.innerHTML = rooms.length
    ? rooms.map(roomCard).join('')
    : '<div class="empty">ยังไม่มีห้องเปิดอยู่<br><span class="small">กด “+ สร้างห้อง” แล้วชวนคนมาร่วมได้เลย</span></div>';
}
const roomCard = (r) => {
  const full = r.slotsLeft <= 0;
  const badge = full ? '<span class="tag">เต็มแล้ว</span>' : `<span class="badge">ขาด ${r.slotsLeft} คน</span>`;
  const action = r.joined
    ? `<button class="btn sm" onclick="go('#/room/${r.id}')">เข้าห้อง</button>`
    : full
      ? '<button class="btn sm" disabled>เต็ม</button>'
      : `<button class="btn sm pink" onclick="joinRoom('${r.id}')">เข้าร่วม</button>`;
  const slots = Array.from({ length: Math.max(0, r.slotsLeft) }).map(() => '<span class="av sm" style="opacity:.35">＋</span>').join('');
  return `<div class="card">
    <div class="row">
      <div class="grow">
        <div class="muted small">🎮 ${esc(r.game)} · ${timeAgo(r.createdAt)}</div>
        <div class="name">${esc(r.title)}</div>
        <div class="muted small">โดย ${esc(r.host?.displayName || '-')}${r.note ? ` · 🕒 ${esc(r.note)}` : ''}</div>
      </div>
      ${badge}
    </div>
    <div class="avrow">${r.members.map((m) => {
      const hasImg = m.avatar?.startsWith('/api/images/');
      return `<span class="av sm" title="${esc(m.displayName)}" ${hasImg ? `style="background-image:url('${esc(m.avatar)}');font-size:0"` : ''}>${hasImg ? '' : esc(m.avatar)}</span>`;
    }).join('')}${slots}</div>
    <div class="row" style="justify-content:space-between;margin-top:8px">
      <span class="muted small">${r.count}/${r.size} คน</span>${action}
    </div>
  </div>`;
};

async function vDM(uid) {
  const d = await api('GET', `/api/dm/${uid}`);
  let reqId = '';
  if (d.rel === 'incoming') reqId = (await api('GET', '/api/friends')).incoming.find((x) => x.user.id === uid)?.requestId || '';
  const notice = {
    none: `<button class="btn sm pink" onclick="addFriend('${uid}')">+ เพิ่มเพื่อน</button>`,
    incoming: `<button class="btn sm pink" onclick="acceptReq('${reqId}')">ตอบรับคำขอ</button>`,
    outgoing: `<span class="tag">รอการตอบรับ</span>`,
  }[d.rel] || '';
  layout({
    title: d.user.displayName, back: true, tab: 'chat',
    right: `<button class="icon" onclick="go('#/user/${uid}')">ⓘ</button>`,
    body: `<div class="msgs" id="msgs"></div>
      ${d.rel === 'friends' ? composerHtml : `<div class="notice"><span>ต้องเป็นเพื่อนกันก่อนจึงจะส่งข้อความได้</span>${notice}</div>`}`,
  });
  const el = $('#msgs');
  paintMsgs(el, bubbles(d.messages, false), true);
  bindComposer(async (t, img) => {
    await api('POST', `/api/dm/${uid}`, { text: t, image: img || undefined });
    const x = await api('GET', `/api/dm/${uid}`);
    paintMsgs(el, bubbles(x.messages, false), true);
  });
  vTimer = setInterval(async () => {
    try { const x = await api('GET', `/api/dm/${uid}`); paintMsgs(el, bubbles(x.messages, false)); } catch {}
  }, 3000);
}

async function vRoom(id) {
  const r = await api('GET', `/api/rooms/${id}`);
  if (!r.joined) { toast('คุณไม่ได้อยู่ในห้องนี้'); return go('#/home'); }
  layout({
    title: r.title, back: true, tab: 'home',
    right: `<button class="btn sm" onclick="openLeave('${id}')">ออกจากห้อง</button>`,
    body: `<div class="card">
        <div class="muted small">🎮 ${esc(r.game)}${r.note ? ` · 🕒 ${esc(r.note)}` : ''} · ${r.count}/${r.size} คน</div>
        <div class="avrow">${r.members.map((m) => {
          const hasImg = m.avatar?.startsWith('/api/images/');
          return `<span class="av sm" title="${esc(m.displayName)}" ${hasImg ? `style="background-image:url('${esc(m.avatar)}');font-size:0"` : ''}>${hasImg ? '' : esc(m.avatar)}</span>`;
        }).join('')}</div>
      </div>
      <div class="msgs" id="msgs"></div>${roomComposer}`,
  });
  const el = $('#msgs');
  const load = async (force) => {
    try {
      const ms = await api('GET', `/api/rooms/${id}/messages`);
      paintMsgs(el, bubbles(ms, true), force);
    } catch (e) {
      stopViewTimer();
      toast(esc(e.message));
      go('#/home');
    }
  };
  await load(true);
  $('#composer').onsubmit = async (e) => {
    e.preventDefault();
    const i = $('#msgIn');
    const t = i.value.trim();
    if (!t) return;
    i.value = '';
    try { await api('POST', `/api/rooms/${id}/messages`, { text: t }); await load(true); }
    catch (err) { toast(esc(err.message)); i.value = t; }
  };
  vTimer = setInterval(() => load(false), 3000);
}

function closeLeave() { $('#leaveModal')?.remove(); }
async function openLeave(id) {
  let r;
  try { r = await api('GET', `/api/rooms/${id}`); } catch (e) { return toast(esc(e.message)); }
  closeLeave();
  const left = Math.max(0, r.canLeaveAt - Date.now());
  const wait = left > 0 ? `<p class="muted small">ต้องอยู่ในห้องอีก ${Math.ceil(left / 1000)} วินาทีก่อนออก</p>` : '';
  const stars = (u) => [1, 2, 3, 4, 5].map((s) => `<button type="button" onclick="rateMember('${id}','${u.id}',${s})" style="background:none;border:0;font-size:24px;color:#ffb74d;cursor:pointer">★</button>`).join('');
  const reviews = r.unrated.length
    ? `<p class="small muted">รีวิวผู้เล่นที่ยังไม่ได้รีวิว:</p>${r.unrated.map((u) => `<div class="row" style="margin:6px 0"><span class="grow">${esc(u.displayName)}</span>${stars(u)}</div>`).join('')}`
    : '<p class="small">รีวิวผู้เล่นครบแล้ว ✅</p>';
  const m = document.createElement('div');
  m.id = 'leaveModal';
  m.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px';
  m.innerHTML = `<div class="card" style="width:100%;max-width:400px;margin:0">
    <h3>ออกจากห้อง</h3>
    ${wait}
    ${reviews}
    <button class="btn primary block" onclick="leaveWith('${id}','review')">ออกเมื่อรีวิวครบ</button>
    <button class="btn block" onclick="leaveWith('${id}','pay')">ออกทันที (ฟรี)</button>
    <button class="btn block" onclick="closeLeave()">ยกเลิก</button>
  </div>`;
  m.addEventListener('click', (e) => { if (e.target === m) closeLeave(); });
  document.body.appendChild(m);
}
async function rateMember(id, uid, score) {
  try {
    await api('POST', `/api/users/${uid}/rate`, { score, comment: '' });
    toast('รีวิวแล้ว ⭐');
    await openLeave(id);
  } catch (e) { toast(esc(e.message)); }
}
async function leaveWith(id, mode) {
  try {
    await api('POST', `/api/rooms/${id}/leave`, { mode });
    closeLeave();
    toast('ออกจากห้องแล้ว');
    go('#/home');
  } catch (e) { toast(esc(e.message)); }
}

      <h2>พบคู่เล่นแล้ว!</h2>
      <div class="muted">${esc(f.match.game)}</div>

// หน้าผู้ดูแลระบบ พร้อมปุ่มเสกเงิน/เครดิต
async function vAdmin(tab = 'stats') {
  if (!state.me?.isAdmin) return go('#/me');
  const tabs = [['stats', 'สถิติ'], ['users', 'จัดการผู้ใช้/เสกเงิน'], ['announce', 'ประกาศ'], ['password', 'รหัสผ่าน']];
  const seg = `<div class="seg">${tabs.map(([k, l]) => `<button class="${k === tab ? 'on' : ''}" onclick="go('#/admin/${k}')">${l}</button>`).join('')}</div>`;
  const title = 'ผู้ดูแลระบบ';

  if (tab === 'stats') {
    const s = await api('GET', '/api/admin/stats');
    layout({ title, back: true, tab: 'me', body: seg + `<div class="stats six">
      <div class="stat"><b>${s.users}</b><span>ผู้ใช้</span></div>
      <div class="stat"><b>${s.friendships}</b><span>ความเป็นเพื่อน</span></div>
      <div class="stat"><b>${s.messages}</b><span>ข้อความ</span></div>
      <div class="stat"><b>${s.groups}</b><span>กลุ่ม</span></div>
    </div>` });
    return;
  }

  if (tab === 'users') {
    const list = await api('GET', '/api/admin/users');
    layout({ title, back: true, tab: 'me', body: seg + `<input id="uq" class="search" placeholder="ค้นหาผู้ใช้...">
      <div id="ulist" class="list" style="margin-top:10px"></div>` });
    const draw = () => {
      const q = $('#uq').value.trim().toLowerCase();
      const rows = list.filter((u) => !q || u.username.includes(q) || u.displayName.toLowerCase().includes(q));
      $('#ulist').innerHTML = rows.length ? rows.map((u) => `<div class="card row">
        ${avatarHtml(u, 'sm')}
        <div class="grow"><b>${esc(u.displayName)}</b> <span class="muted small">@${esc(u.username)}</span>${u.isAdmin ? ' <span class="tag">admin</span>' : ''}
          <div class="muted small">เครดิต: ${u.credits} · สมัคร ${timeAgo(u.createdAt)}</div></div>
        <button class="btn sm pink" onclick="magicCredits('${u.id}')">✨ เสกเงิน</button>
        ${u.isAdmin ? '' : `<button class="btn sm ghost" onclick="deleteUser('${u.id}','${esc(u.username)}')">ลบ</button>`}
      </div>`).join('') : '<div class="empty">ไม่พบผู้ใช้</div>';
    };
    $('#uq').oninput = draw;
    draw();
    return;
  }

  if (tab === 'password') {
    layout({ title, back: true, tab: 'me', body: seg + `<form id="pwForm" class="card form">
      <label>รหัสผ่านใหม่ของผู้ดูแลระบบ (อย่างน้อย 6 ตัว)</label>
      <input name="password" type="password" minlength="6" required autocomplete="new-password">
      <button class="btn primary">เปลี่ยนรหัสผ่าน</button>
    </form>` });
    $('#pwForm').onsubmit = async (e) => {
      e.preventDefault();
      try {
        await api('POST', '/api/admin/password', { password: new FormData(e.target).get('password') });
        toast('เปลี่ยนรหัสผ่านแล้ว ✅');
        e.target.reset();
      } catch (err) { toast(esc(err.message)); }
    };
    return;
  }

  layout({ title, back: true, tab: 'me', body: seg + `<form id="annForm" class="card form">
    <label>ข้อความประกาศถึงผู้ใช้ทุกคน (ไม่เกิน 200 ตัวอักษร)</label>
    <textarea name="text" maxlength="200" required></textarea>
    <button class="btn primary">ส่งประกาศ</button>
  </form>` });
  $('#annForm').onsubmit = async (e) => {
    e.preventDefault();
    try {
      const r = await api('POST', '/api/admin/announce', { text: new FormData(e.target).get('text') });
      toast(`ส่งประกาศถึง ${r.sent} คนแล้ว`);
      e.target.reset();
    } catch (err) { toast(esc(err.message)); }
  };
}

async function vEdit() {

      <label>ตัวอย่างหน้าปก & รูปโปรไฟล์</label>
      <div class="preview-box">

      <input type="file" id="customCover" accept="image/png,image/jpeg,image/gif,image/webp">
      <div style="display:flex;gap:8px;margin-top:6px">
        <div style="flex:1"><label class="small">ซูมหน้าปก: <span id="coverZoomVal">${me.coverZoom || 100}</span>%</label><input type="range" id="coverZoom" min="50" max="200" value="${me.coverZoom || 100}" style="width:100%"></div>
      </div>
      <div style="display:flex;gap:8px;margin-top:4px">
        <div style="flex:1"><label class="small">เลื่อนซ้าย-ขวา</label><input type="range" id="coverPosX" min="0" max="100" value="${me.coverPos?.x || 50}" style="width:100%"></div>
        <div style="flex:1"><label class="small">เลื่อนขึ้น-ลง</label><input type="range" id="coverPosY" min="0" max="100" value="${me.coverPos?.y || 50}" style="width:100%"></div>
      </div>

      <label style="margin-top:16px">รูปประจำตัว (เลือกอีโมจิ หรือ อัปโหลดรูป)</label>
      <div class="avpick">${S.avatars.map((a) => `<button type="button" class="av pick ${a === me.avatar ? 'on' : ''}" data-a="${a}">${a}</button>`).join('')}</div>
      <input type="file" id="customAvatar" accept="image/png,image/jpeg,image/gif,image/webp" style="margin-top:6px">
      
      <div style="display:flex;gap:8px;margin-top:6px">
        <div style="flex:1"><label class="small">ซูมรูปโปรไฟล์: <span id="avZoomVal">${me.avatarZoom || 100}</span>%</label><input type="range" id="avZoom" min="50" max="200" value="${me.avatarZoom || 100}" style="width:100%"></div>
      </div>
      <div style="display:flex;gap:8px;margin-top:4px">
        <div style="flex:1"><label class="small">เลื่อนซ้าย-ขวา</label><input type="range" id="avPosX" min="0" max="100" value="${me.avatarPos?.x || 50}" style="width:100%"></div>
        <div style="flex:1"><label class="small">เลื่อนขึ้น-ลง</label><input type="range" id="avPosY" min="0" max="100" value="${me.avatarPos?.y || 50}" style="width:100%"></div>
      </div>

      <label>แนะนำตัว<textarea name="bio" maxlength="200">${esc(me.bio || '')}</textarea></label>
      <label>เกมที่เล่น (สูงสุด 6 เกม)</label>
      <div class="games" id="gpick">${S.games.map((g) => `<button type="button" class="game-btn ${me.games.includes(g) ? 'on' : ''}" data-g="${esc(g)}">${esc(g)}</button>`).join('')}</div>

  });

  let avatar = me.avatar;

  let customCoverBase64 = null;
  let avatarZoom = me.avatarZoom || 100;
  let avatarPos = me.avatarPos || { x: 50, y: 50 };
  let coverZoom = me.coverZoom || 100;
  let coverPos = me.coverPos || { x: 50, y: 50 };

  function updatePreview() {
    const c = $('#prevCover');
    const a = $('#prevAv');
    if (c) c.style.backgroundSize = coverZoom + '%';
    if (c) c.style.backgroundPosition = `${coverPos.x}% ${coverPos.y}%`;
    if (a) a.style.backgroundSize = avatarZoom + '%';
    if (a) a.style.backgroundPosition = `${avatarPos.x}% ${avatarPos.y}%`;
  }

  $('#coverZoom').oninput = (e) => { coverZoom = e.target.value; $('#coverZoomVal').textContent = coverZoom; updatePreview(); };
  $('#coverPosX').oninput = (e) => { coverPos.x = e.target.value; updatePreview(); };
  $('#coverPosY').oninput = (e) => { coverPos.y = e.target.value; updatePreview(); };

  $('#avZoom').oninput = (e) => { avatarZoom = e.target.value; $('#avZoomVal').textContent = avatarZoom; updatePreview(); };
  $('#avPosX').oninput = (e) => { avatarPos.x = e.target.value; updatePreview(); };
  $('#avPosY').oninput = (e) => { avatarPos.y = e.target.value; updatePreview(); };

    document.querySelectorAll('.avpick button').forEach((x) => x.classList.toggle('on', x === b));

    avEl.style.backgroundImage = 'none';
    avEl.textContent = avatar;
  });

  $('#customAvatar').onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      customAvatarBase64 = reader.result;
      const avEl = $('#prevAv');
      avEl.textContent = '';
      avEl.style.backgroundImage = `url('${customAvatarBase64}')`;
      toast('โหลดรูปโปรไฟล์แล้ว');
    };
    reader.readAsDataURL(file);
  };

  $('#customCover').onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      customCoverBase64 = reader.result;
      const cEl = $('#prevCover');
      cEl.style.backgroundImage = `url('${customCoverBase64}')`;
      toast('โหลดรูปหน้าปกแล้ว');
    };
    reader.readAsDataURL(file);
  };

  document.querySelectorAll('#gpick button').forEach((b) => b.onclick = () => {
    const picked = document.querySelectorAll('#gpick .on').length;
    if (!b.classList.contains('on') && picked >= 6) return toast('เลือกได้สูงสุด 6 เกม');
    b.classList.toggle('on');
  });

  $('#eform').onsubmit = async (e) => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(e.target));
    const games = [...document.querySelectorAll('#gpick .on')].map((b) => b.dataset.g);
    try {
      const payload = {
        ...f, games,
        avatarZoom, avatarPos,
        coverZoom, coverPos,
      };
      if (customAvatarBase64) payload.avatar = customAvatarBase64;
      else payload.avatar = avatar;
      if (customCoverBase64) payload.cover = customCoverBase64;

      const updated = await api('PUT', '/api/me', payload);
      state.me = { ...state.me, ...updated };
      toast('บันทึกโปรไฟล์สำเร็จ! ✨');
      go('#/me');
    } catch (err) { toast(esc(err.message)); }
  };
}

async function vUser(id) {

  let actions = '';
  if (u.rel === 'friends') {
    const fid = fr.friends.find((x) => x.id === id)?.friendshipId;
    actions = `<button class="btn primary" onclick="go('#/dm/${id}')">💬 ส่งข้อความ</button>
      <button class="btn" onclick="dropReq('${fid}','ลบเพื่อนคนนี้?')">ลบเพื่อน</button>`;
  } else if (u.rel === 'incoming') {
    const rid = fr.incoming.find((x) => x.user.id === id)?.requestId;
    actions = `<button class="btn primary" onclick="acceptReq('${rid}')">ตอบรับคำขอ</button>
      <button class="btn" onclick="dropReq('${rid}')">ปฏิเสธ</button>`;

    actions = `<button class="btn" onclick="dropReq('${rid}','ยกเลิกคำขอ?')">ยกเลิกคำขอ</button>`;
  } else {
    actions = `<button class="btn primary" onclick="addFriend('${id}')">+ เพิ่มเพื่อน</button>`;
  }
  let sel = 0;
  layout({
    title: u.displayName, back: true,
    body: `${profileHeader(u)}
      <div class="actions">${actions}</div>
      <div class="card">
        <h3>ให้คะแนนผู้เล่นคนนี้</h3>
        <div class="starpick" id="sp">${[1, 2, 3, 4, 5].map((i) => `<button type="button" data-s="${i}">★</button>`).join('')}</div>
        <input id="rc" maxlength="200" placeholder="ความคิดเห็น (ไม่บังคับ)">
        <button class="btn primary block" id="rbtn">ส่งคะแนน</button>
      </div>
      <div class="card"><h3>รีวิว</h3>${ratingsHtml(u)}</div>`,
  });
  document.querySelectorAll('#sp button').forEach((b) => b.onclick = () => {
    sel = +b.dataset.s;
    document.querySelectorAll('#sp button').forEach((x) => x.classList.toggle('on', +x.dataset.s <= sel));
  });
  $('#rbtn').onclick = () => {
    if (!sel) return toast('เลือกจำนวนดาวก่อน');
    api('POST', `/api/users/${id}/rate`, { score: sel, comment: $('#rc').value })
      .then(() => { toast('ส่งคะแนนแล้ว ⭐'); render(); })
      .catch((e) => toast(esc(e.message)));
  };
}

async function vFriends() {
  const f = await api('GET', '/api/friends');
  const row = (u, actions) => `<div class="card row">${avatarHtml(u)}
    <div class="grow"><b class="link-name" onclick="go('#/user/${u.id}')">${esc(u.displayName)}</b><div class="muted small">@${esc(u.username)}</div></div>
    ${actions}</div>`;
  layout({
    title: 'เพื่อนและคำขอ', back: true, tab: 'chat',
    body: `
      <h3 class="sec">คำขอที่ได้รับ (${f.incoming.length})</h3>
      ${f.incoming.length ? f.incoming.map((r) => row(r.user, `<button class="btn sm pink" onclick="acceptReq('${r.requestId}')">ตอบรับ</button><button class="btn sm" onclick="dropReq('${r.requestId}')">ปฏิเสธ</button>`)).join('') : '<div class="empty small">ไม่มีคำขอใหม่</div>'}
      <h3 class="sec">คำขอที่ส่งไป (${f.outgoing.length})</h3>
      ${f.outgoing.length ? f.outgoing.map((r) => row(r.user, `<button class="btn sm" onclick="dropReq('${r.requestId}','ยกเลิกคำขอ?')">ยกเลิก</button>`)).join('') : '<div class="empty small">ไม่มีคำขอที่ส่งไป</div>'}
      <h3 class="sec">เพื่อน (${f.friends.length})</h3>
      ${f.friends.length ? f.friends.map((u) => row(u, `<button class="btn sm" onclick="go('#/dm/${u.id}')">💬</button><button class="btn sm" onclick="dropReq('${u.friendshipId}','ลบเพื่อนคนนี้?')">ลบ</button>`)).join('') : '<div class="empty small">ยังไม่มีเพื่อน ลองค้นหาผู้เล่นดูสิ</div>'}`,
  });
}

async function vVisitors() {
  const v = await api('GET', '/api/visitors');
  layout({
    title: 'ผู้เข้าชมโปรไฟล์', back: true, tab: 'me',
    body: v.length ? `<div class="list">${v.map((x) => `<a class="card row link" href="#/user/${x.viewer.id}">
        ${avatarHtml(x.viewer)}
        <div class="grow"><b>${esc(x.viewer.displayName)}</b><div class="muted small">${timeAgo(x.at)}</div></div>›
      </a>`).join('')}</div>` : '<div class="empty">ยังไม่มีผู้เข้าชม</div>',
  });
}

(async function boot() {
  try {
    state.meta = await (await fetch('/api/meta')).json();
  } catch {
    document.body.insertAdjacentHTML('beforeend', '<p style="padding:20px">เซิร์ฟเวอร์ยังไม่พร้อม</p>');
    return;
  }
  if (state.token) {
    try { state.me = await api('GET', '/api/me'); startPolling(); }
    catch { state.me = null; }
  }
  if (!state.me) { state.token = null; localStorage.removeItem('gb_token'); }
  if (!location.hash) location.hash = '#/home';
  render();
})();
</script>
</body>
</html>
